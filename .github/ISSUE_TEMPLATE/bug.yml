name: 버그
description: 재현 가능한 문제를 신고합니다.
title: "[버그] "
body:
  - type: markdown
    attributes:
      value: 로그와 화면 자료에서 비밀번호, 토큰, 개인정보를 제거해 주세요.

  - type: textarea
    id: problem
    attributes:
      label: 문제 현상
      description: 실제로 발생한 문제를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 재현할 수 있는 순서를 적어 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      description: 정상이라면 어떻게 동작해야 하는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: additional_information
    attributes:
      label: 환경 및 참고 자료
      description: 브라우저, OS, 스크린샷, 민감정보를 제거한 로그가 있으면 첨부해 주세요.
      placeholder: 없음
