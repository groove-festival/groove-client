name: 문서 작업
description: 프로젝트 문서의 추가나 수정을 제안합니다.
title: "[문서] "
body:
  - type: markdown
    attributes:
      value: 비밀번호, 토큰, 개인정보, 원본 사용자 데이터는 포함하지 마세요.

  - type: textarea
    id: target
    attributes:
      label: 대상 문서
      description: 추가하거나 수정할 문서와 위치를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: 작업 내용
      description: 어떤 내용을 추가하거나 수정해야 하는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 Issue, PR, 명세가 있으면 첨부해 주세요.
      placeholder: 없음
