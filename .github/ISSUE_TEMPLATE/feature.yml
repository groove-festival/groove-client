name: 기능 제안
description: 사용자 문제와 완료 기준이 있는 프론트엔드 기능 작업을 제안합니다.
title: "[기능] "
body:
  - type: markdown
    attributes:
      value: |
        구현 방법보다 먼저 해결할 사용자 문제와 완료 기준을 적어 주세요.
        비밀번호, 토큰, 개인정보, 원본 사용자 데이터는 포함하지 마세요.

  - type: checkboxes
    id: duplicate_check
    attributes:
      label: 중복 확인
      options:
        - label: 같은 문제나 기능을 다루는 기존 Issue를 확인했습니다.
          required: true

  - type: textarea
    id: user_problem
    attributes:
      label: 사용자 문제
      description: 누가 어떤 상황에서 무엇 때문에 불편한지 설명해 주세요.
      placeholder: 현재 사용자는 ... 상황에서 ... 문제를 겪습니다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이번 Issue에서 변경해야 할 동작과 화면을 적어 주세요.
      placeholder: |
        - 포함할 동작
        - 변경할 화면 또는 흐름
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: 비목표
      description: 이번 작업에서 의도적으로 다루지 않을 내용을 적어 주세요.
      placeholder: 없음

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 기준
      description: 구현 완료 여부를 관찰 가능한 조건으로 작성해 주세요.
      placeholder: |
        - [ ] 사용자가 ... 할 수 있다.
        - [ ] 오류·로딩·빈 상태가 정의되어 있다.
        - [ ] 관련 테스트와 문서가 동기화되어 있다.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 관련 자료
      description: 관련 PRD, 디자인, Discussion, 기존 Issue가 있으면 링크하세요.
      placeholder: 없음

  - type: textarea
    id: ai_context
    attributes:
      label: AI 지원 사용 맥락
      description: AI가 이 제안이나 결정에 실질적으로 기여했다면 사용 목적과 참고 맥락을 요약하세요.
      placeholder: 사용하지 않음 또는 사용 목적과 안전한 입력 맥락 요약
