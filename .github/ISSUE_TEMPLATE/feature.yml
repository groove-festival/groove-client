name: 기능 작업
description: 새로운 기능이나 사용자 동작의 구현 작업을 등록합니다.
title: "[기능] "
body:
  - type: markdown
    attributes:
      value: 비밀번호, 토큰, 개인정보, 원본 사용자 데이터는 포함하지 마세요.

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 어떤 문제를 해결하려는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: 원하는 결과
      description: 사용자가 무엇을 할 수 있어야 하는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 PRD, 디자인, Issue가 있으면 첨부해 주세요.
      placeholder: 없음
