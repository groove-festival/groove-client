name: 리팩토링
description: 동작을 유지하면서 코드 구조를 개선하는 작업을 제안합니다.
title: "[리팩토링] "
body:
  - type: markdown
    attributes:
      value: 비밀번호, 토큰, 개인정보, 원본 사용자 데이터는 포함하지 마세요.

  - type: textarea
    id: target
    attributes:
      label: 리팩토링 대상
      description: 개선할 파일, 모듈 또는 구조를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 필요한 이유
      description: 현재 문제와 기대하는 개선점을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함할 범위와 제외할 범위를 필요한 만큼 적어 주세요.
      placeholder: 없음
