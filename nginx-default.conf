server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 텍스트 파일만 압축한다. 이미지·글꼴(webp, png, woff2)은 이미 압축된 형식이다.
  gzip on;
  # 앞단 프록시가 HTTP/1.0 으로 넘기는 요청도 압축한다. 기본값(1.1)이면 건너뛴다.
  gzip_http_version 1.0;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

  location = / {
    return 301 /groove/;
  }

  location = /runtime-env.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /groove/assets/ {
    alias /usr/share/nginx/html/groove/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /groove/ {
    alias /usr/share/nginx/html/groove/;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /groove/index.html;
  }
}
