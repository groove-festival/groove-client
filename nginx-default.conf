server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 301 /groove/;
  }

  location = /runtime-env.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /groove/assets/ {
    alias /usr/share/nginx/html/groove/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /groove/ {
    alias /usr/share/nginx/html/groove/;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /groove/index.html;
  }
}
